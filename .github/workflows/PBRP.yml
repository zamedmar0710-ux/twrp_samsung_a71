name: PBRP 12.1 Compiler (A71)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Maximize Build Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune -a -f

    - name: Install Android Build Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Initialize PBRP 12.1 Source Manifest
      run: |
        mkdir pbrp && cd pbrp
        git config --global user.name "ZamMichaelEmrich"
        git config --global user.email "zamedmar0710@gmail.com"
        git config --global color.ui false
        
        # Download the standalone python-executable script directly into the working directory
        curl -sSL https://githubusercontent.com > ./repo
        chmod a+x ./repo
        
        # Run the standalone script explicitly using python3 to bypass system path configs
        python3 ./repo init -u https://github.com -b android-12.1 --depth=1 --no-repo-verify
        python3 ./repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

    - name: Clone Geekmaster21 Galaxy A71 Tree
      run: |
        cd pbrp
        git clone https://github.com -b android-12.1 device/samsung/a71 || git clone https://github.com device/samsung/a71

    - name: Set PitchBlack Compilation Flags
      run: |
        cd pbrp/device/samsung/a71
        echo "TW_THEME := portrait_hdpi" >> BoardConfig.mk
        echo "PB_BUILD_NAME := Unofficial" >> BoardConfig.mk
        echo "PB_RECOVERY_VERSION := 4.0" >> BoardConfig.mk
        echo "PB_MAINTAINER := ZamMichaelEmrich" >> BoardConfig.mk

    - name: Run Compilation Matrix
      run: |
        cd pbrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_a71-eng || lunch pbrp_a71-eng
        make recoveryimage -j$(nproc)

    - name: Export Flashable Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PBRP-A71-12.1-Image
        path: |
          pbrp/out/target/product/a71/*.img
          pbrp/out/target/product/a71/*.zip
          
