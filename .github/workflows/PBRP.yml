name: Build PBRP Android 12.1 for Galaxy A71

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
        gcc-multilib g++-multilib libc6-dev-i386 libncurses5 lib32ncurses5-dev \
        x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils \
        xsltproc unzip fontconfig u-boot-tools python3 rsync

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync PBRP 12.1 Manifest
      run: |
        mkdir pbrp_workspace && cd pbrp_workspace
        git config --global user.name "ZamMichaelEmrich"
        git config --global user.email "zamedmar0710@gmail.com"
        # Shallow clone (--depth=1) drastically optimizes build speed on cloud run-times
        repo init --depth=1 -u https://github.com -b android-12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Galaxy A71 Device Tree
      run: |
        cd pbrp_workspace
        git clone https://github.com -b android-11 device/samsung/a71

    - name: Run Compilation Matrix
      run: |
        cd pbrp_workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        # Lunch pattern changes to pb_<device>-eng for the Android 12.1 manifest
        lunch pb_a71-eng || lunch omni_a71-userdebug
        mka pbrp -j$(nproc --all)

    - name: Upload Compiled PBRP Recovery Image
      uses: actions/upload-artifact@v3
      with:
        name: PBRP-A12.1-Galaxy-A71
        path: |
          pbrp_workspace/out/target/product/a71/recovery.img
          pbrp_workspace/out/target/product/a71/PBRP-*.zip
          
